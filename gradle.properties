# Project-wide Gradle settings.
# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_gradle.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting a larger heap size for the Gradle daemon helps performance.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX libraries use this property to determine if they should be used.
android.useAndroidX=true

# Automatically convert third-party libraries to use AndroidX.
android.enableJetifier=false

# Kotlin code style for the project.
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library.
android.nonTransitiveRClass=true

org.gradle.java.installations.paths=/home/phantom/.gradle/jdks/eclipse_adoptium-21-amd64-linux.2
org.gradle.java.home=/home/phantom/.gradle/jdks/eclipse_adoptium-21-amd64-linux.2
