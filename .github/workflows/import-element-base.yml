name: Import Element Android base

on:
  push:
    branches: [main]
    paths: [".github/workflows/import-element-base.yml"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-element-android-base
  cancel-in-progress: false

jobs:
  import:
    if: github.event.head_commit.message == 'Initialize Element Android source from upstream'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out messenger
        uses: actions/checkout@v4

      - name: Save integration notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/messenger-notes
          cp .github/workflows/import-element-base.yml /tmp/messenger-notes/import-element-base.yml
          cp docs/TELEGRAM_STYLE_PARITY.md /tmp/messenger-notes/TELEGRAM_STYLE_PARITY.md

      - name: Add upstream Element Android source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch develop https://github.com/element-hq/element-android.git /tmp/element-android
          echo "Upstream Element revision: $(git -C /tmp/element-android rev-parse HEAD)"
          rsync -a --exclude='/.git/' /tmp/element-android/ "$GITHUB_WORKSPACE/"
          mkdir -p .github/workflows docs
          cp /tmp/messenger-notes/import-element-base.yml .github/workflows/import-element-base.yml
          cp /tmp/messenger-notes/TELEGRAM_STYLE_PARITY.md docs/TELEGRAM_STYLE_PARITY.md

      - name: Push an import branch and open a review request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/element-android-base
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "chore: import Element Android source base"
          git push --set-upstream origin automation/element-android-base
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head automation/element-android-base --title "Import Element Android as the messenger base" --body "Imports the upstream Element Android develop snapshot as the application base. See docs/TELEGRAM_STYLE_PARITY.md for the Telegram-inspired UI acceptance checklist. This change preserves the Matrix/Element architecture and does not copy Telegram source files or assets. Review license notices and build compatibility before merging."
