name: Retry Element Android source import

on:
  push:
    branches: [main]
    paths: [".github/workflows/import-element-base-retry.yml"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-element-android-base
  cancel-in-progress: false

jobs:
  import:
    if: github.event.head_commit.message == 'Retry import Element Android without upstream workflows'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out messenger
        uses: actions/checkout@v4

      - name: Save integration notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/messenger-notes
          cp docs/TELEGRAM_STYLE_PARITY.md /tmp/messenger-notes/TELEGRAM_STYLE_PARITY.md

      - name: Add upstream Element Android source without upstream Actions workflows
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch develop https://github.com/element-hq/element-android.git /tmp/element-android
          echo "Upstream Element revision: $(git -C /tmp/element-android rev-parse HEAD)"
          # GitHub App token does not have the workflows permission. Excluding
          # upstream Actions files keeps the import branch push within its scope.
          rsync -a --exclude='/.git/' --exclude='/.github/workflows/***' /tmp/element-android/ "$GITHUB_WORKSPACE/"
          mkdir -p docs
          cp /tmp/messenger-notes/TELEGRAM_STYLE_PARITY.md docs/TELEGRAM_STYLE_PARITY.md

      - name: Push import branch and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/element-android-base-retry
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to import."
            exit 0
          fi
          git commit -m "chore: import Element Android source base"
          git push --set-upstream origin automation/element-android-base-retry
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head automation/element-android-base-retry --title "Import Element Android as the messenger base" --body "Imports the upstream Element Android develop snapshot as the application base while excluding upstream GitHub Actions workflows (the linked GitHub App lacks workflow permission). See docs/TELEGRAM_STYLE_PARITY.md for Telegram-inspired UI acceptance criteria. Matrix/Element behavior is preserved; Telegram source files/assets are not copied."
